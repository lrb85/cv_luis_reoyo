<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Group for all pins -->
  <g stroke="#000000" stroke-width="6" stroke-linecap="round">
    <!-- Top Pins -->
    <line x1="50" y1="8" x2="50" y2="22" />
    <line x1="70" y1="8" x2="70" y2="22" />
    <line x1="90" y1="8" x2="90" y2="22" />
    <line x1="110" y1="8" x2="110" y2="22" />
    <line x1="130" y1="8" x2="130" y2="22" />
    <line x1="150" y1="8" x2="150" y2="22" />

    <!-- Bottom Pins -->
    <line x1="50" y1="178" x2="50" y2="192" />
    <line x1="70" y1="178" x2="70" y2="192" />
    <line x1="90" y1="178" x2="90" y2="192" />
    <line x1="110" y1="178" x2="110" y2="192" />
    <line x1="130" y1="178" x2="130" y2="192" />
    <line x1="150" y1="178" x2="150" y2="192" />

    <!-- Left Pins -->
    <line x1="8" y1="50" x2="22" y2="50" />
    <line x1="8" y1="70" x2="22" y2="70" />
    <line x1="8" y1="90" x2="22" y2="90" />
    <line x1="8" y1="110" x2="22" y2="110" />
    <line x1="8" y1="130" x2="22" y2="130" />
    <line x1="8" y1="150" x2="22" y2="150" />

    <!-- Right Pins -->
    <line x1="178" y1="50" x2="192" y2="50" />
    <line x1="178" y1="70" x2="192" y2="70" />
    <line x1="178" y1="90" x2="192" y2="90" />
    <line x1="178" y1="110" x2="192" y2="110" />
    <line x1="178" y1="130" x2="192" y2="130" />
    <line x1="178" y1="150" x2="192" y2="150" />
  </g>

  <!-- Main Chip Body -->
  <rect x="30" y="30" width="140" height="140" rx="16" fill="#000000" />

  <!-- Inner White Square -->
  <rect x="71" y="67" width="58" height="66" fill="#FFFFFF" />

  <!-- Orientation Dot -->
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" />

  <!-- Center Text -->
  <text x="100" y="105" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#000000">DPE</text>
</svg>