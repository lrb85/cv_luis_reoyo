<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!--
      M 70 115: Empieza en la esquina superior izquierda.
      C ... 200 50: Sube creando una curva hasta llegar a un PICO EXACTO en el centro superior (Y=50, que es más alto).
      C ... 330 115: Baja desde el pico hasta la esquina superior derecha.
    -->
    <path id="shieldShape" d="M 70 115
                             C 120 100 160 70 200 50
                             C 240 70 280 100 330 115
                             C 330 250 280 340 200 370
                             C 120 340 70 250 70 115 Z" />

    <!-- Clip path para que los circuitos respeten el nuevo borde -->
    <clipPath id="shieldClip">
      <use href="#shieldShape" />
    </clipPath>
  </defs>

  <!-- Fondo Principal -->
  <rect width="400" height="480" fill="#0a0a0a" />

  <!-- Efecto de Marco / Bisel Exterior -->
  <rect x="8" y="8" width="384" height="464" fill="none" stroke="#1a1a1a" stroke-width="4" />
  <rect x="12" y="12" width="376" height="456" fill="none" stroke="#444444" stroke-width="2" />
  <rect x="14" y="14" width="372" height="452" fill="none" stroke="#000000" stroke-width="6" />

  <!-- Pestañas amarillas de las esquinas -->
  <rect x="0" y="465" width="22" height="15" fill="#FFCC00" />
  <rect x="378" y="465" width="22" height="15" fill="#FFCC00" />

  <!-- Cuadrado blanco interior -->
  <rect x="30" y="30" width="340" height="360" fill="#ffffff" />

  <!-- Patrón del circuito -->
  <g clip-path="url(#shieldClip)" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">

    <!-- Pistas Izquierdas -->
    <path d="M 0 140 L 160 140 L 180 160" />
    <path d="M 140 140 L 160 120" />
    <path d="M 0 180 L 180 180 L 200 200" />
    <path d="M 0 220 L 200 220 L 220 240" />

    <!-- Pistas Derechas -->
    <path d="M 190 140 L 280 230 L 280 400" />
    <path d="M 210 180 L 260 230 L 260 400" />
    <path d="M 230 220 L 240 230 L 240 400" />

    <!-- Nodos del circuito -->
    <g fill="#ffffff" stroke="#000000" stroke-width="6">
      <circle cx="110" cy="140" r="7" />
      <circle cx="160" cy="120" r="7" />
      <circle cx="180" cy="160" r="7" />
      <circle cx="200" cy="200" r="7" />
      <circle cx="220" cy="240" r="7" />

      <circle cx="190" cy="140" r="7" />
      <circle cx="210" cy="180" r="7" />
      <circle cx="230" cy="220" r="7" />
    </g>
  </g>

  <!-- Borde del escudo: stroke-linejoin="miter" asegura que la punta de arriba sea 100% afilada -->
  <use href="#shieldShape" fill="none" stroke="#000000" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" />

  <!-- Texto Inferior -->
  <text x="200" y="446" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="52" fill="#FFCC00" text-anchor="middle" letter-spacing="1.5">CPPHP</text>

</svg>