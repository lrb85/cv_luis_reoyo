<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Shadow for the outer badge -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Gradient for the blue background -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5899" />
      <stop offset="100%" stop-color="#043868" />
    </linearGradient>

    <!-- Gradient for the top white section -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E5E5" />
    </linearGradient>

    <!-- Gradient for the bottom grey section -->
    <linearGradient id="greyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCDCDC" />
      <stop offset="100%" stop-color="#B8B8B8" />
    </linearGradient>
  </defs>

  <!-- Outer Blue Background with Shadow -->
  <rect x="8" y="8" width="144" height="144" rx="10" fill="url(#blueGrad)" filter="url(#badgeShadow)" />

  <!-- Subtle inner stroke for the blue box to give a slight beveled edge -->
  <rect x="9" y="9" width="142" height="142" rx="9" fill="none" stroke="#3A7EB9" stroke-width="1" opacity="0.6"/>

  <!-- Upper White Inner Area (with top-left chamfer) -->
  <path d="M 46 14
           L 142 14 C 144.2 14, 146 15.8, 146 18
           L 146 110
           L 14 110
           L 14 46 Z"
        fill="url(#whiteGrad)" />

  <!-- Lower Grey Inner Area ("CERTIFIED" background) -->
  <path d="M 14 110
           L 146 110
           L 146 142 C 146 144.2, 144.2 146, 142 146
           L 18 146 C 15.8 146, 14 144.2, 14 142 Z"
        fill="url(#greyGrad)" />

  <!-- White Separator Line -->
  <line x1="14" y1="110" x2="146" y2="110" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Top Right Text: EC-Council -->
  <text x="138" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="12" fill="#ED1C24" text-anchor="end" font-stretch="condensed">EC-Council</text>

  <!-- Central CEH Logo Group -->
  <g>
    <!-- Vertical Red Divider -->
    <line x1="74" y1="58" x2="74" y2="96" stroke="#ED1C24" stroke-width="1.8" />

    <!-- Large Letter C -->
    <text x="70" y="86" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" fill="#0D0D0D" text-anchor="end">C</text>

    <!-- Large Letters EH -->
    <text x="78" y="86" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" fill="#0D0D0D" text-anchor="start" letter-spacing="-0.5">EH</text>

    <!-- TM Symbol -->
    <text x="105" y="60" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4" fill="#0D0D0D">TM</text>

    <!-- Small Subtext: Certified -->
    <text x="70" y="94" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4" fill="#0D0D0D" text-anchor="end">Certified</text>

    <!-- Small Subtext: Ethical Hacker -->
    <text x="78" y="94" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4" fill="#0D0D0D" text-anchor="start">Ethical</text>
    <text x="92" y="94" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="4" fill="#0D0D0D" text-anchor="start">Hacker</text>
  </g>

  <!-- Bottom Text: CERTIFIED -->
  <text x="80" y="133" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle" letter-spacing="1.5">CERTIFIED</text>

</svg>